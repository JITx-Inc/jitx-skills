# Eval contract for jitx-layout-constraints.
#
# Scope: the design-rule set a board carries. Board-wide defaults, net-class
# tags and their width and clearance rules, power routing width, pour rules,
# the tag-based step-down where a class rule cannot fit a package pad, and the
# after-build checks that prove the rules were honored. Decoupling is in scope
# as a placement principle only: loop inductance between the power and return
# pins and the capacitor decides placement, the datasheet decides count, value
# and package, and this skill carries no sizing heuristic and no solver.
#
# The skill routes to owners rather than carrying their knowledge: the rule
# system to the published Design Constraints page, worked designs to
# jitxexamples, checkers to jitxlib.verify, and the evidence table to its own
# reference. The knowledge being reachable is therefore part of what is scored,
# not a precondition assumed to hold.
goal: |
  An engineer describes a board's rails, signals, packages, and fab in plain
  terms and gets back a design-rule set in JITX Python: board-wide defaults,
  one tag per net class with the width and clearance rules that express it,
  a step-down rule ladder wherever a class rule cannot physically reach a
  package pad, and the checks that read the built design back and confirm
  widths, clearances, route realization, and that every declared rule was
  observed by something. Excellent = every rule uses an effect and arity the
  installed runtime has, every number traces to a fab row, a cited engineering
  source, a stated derivation, or a labeled skill default, the rules are
  reachable from the design tree and out-rank the defaults they override, and
  nothing is called done on build success alone. The skill carries routing to
  the checks rather than the checks themselves, so a weaker agent model
  following it should still get there by fetching what it was pointed at, and
  should stop and say so when a pointer does not resolve rather than
  substituting recall.
dimensions:
  - "RULE_CORRECTNESS: does every rule use an effect that exists (eight unary effects, clearance as the only binary effect), is every clearance a two-condition rule, is every override at a priority above the default it overrides, and are all tag classes declared at module scope and assigned to objects that can carry them?"
  - "PROVENANCE: does every width and clearance trace to a fabrication-constraint row, a cited engineering source, a stated derivation, or a skill default labeled on the same line, with unstated values raised as open items rather than filled in? A value no fab sheet can contain, such as the clearance a sensitive net needs from an aggressor, requires a derivation: the disturbance budget, the aggressor's edge rate or knee frequency, and the coupling estimate with the stackup it came from. A different defensible number with a stated derivation scores full marks; the expected number with no reasoning does not."
  - "REALIZATION_VERIFIED: are widths, clearances, and route realization checked against the captured design after build; is every declared rule witnessed by a check, with unwitnessed rules counted and named rather than passed over; is each measured clearance identified as router-generated copper (the rule acting) or code-authored copper (the author's geometry, which the rule does not move); are rules the capture cannot expose (trace-to-pour clearance, thermal relief, sliver removal) named as unverified rather than closed from the fabrication export; and, when no runtime is available, is that stated as an open item instead of implied by a clean build?"
  - "FANOUT_STEPDOWN: where a class-level width cannot fit a package pad, is the step-down expressed as a specific escape tag on the route segment with its own width and clearance rules above the class rule and a control point at the transition, with the escape width derived strictly inside the narrowest selected pad at fixed precision rather than typed in or left equal to a pad width? Where a second rule contends for the same copper, such as a separation requirement pulling against an escape that must fit inside a pad, is the contention resolved and stated rather than one side silently dropped?"
  - "OWNERSHIP: do board-wide rules live on the Design, local rules on the circuit that owns the tagged objects, with tags and rules as structural attributes (no string-keyed tables, no rules built at module import time, no parallel model of the design)?"
  - "RETRIEVAL: where the skill points at an owner instead of carrying the knowledge, does the output show the pointer was actually followed, by using what only that source supplies rather than a plausible reconstruction of it, and does it name the source and how it was reached? Knowledge the restructure moved out of the skill (the rule system, the worked pattern modules, the checker library) must be reached through the documentation as built. A locally installed package satisfying that pointer is not evidence the documentation carries it, because the reader may not have the package; reading installed jitx source to confirm a signature remains correct and is a separate thing. When a pointer does not resolve, is the failure reported as a blocking open item naming the unreachable source, with the work either stopped or continued under a stated assumption, rather than filled in from memory as though the fetch had succeeded?"
hard_fails:
  - "A clearance effect on a single-condition rule, or any effect that the installed jitx.constraints module does not have."
  - "A per-route width or clearance parameter, a code-created neckdown region, or a neckdown tag presented as API."
  - "RoutingStructure.NeckDown recommended as the code-side mechanism for fanout or escape."
  - "A width or clearance value with no fabrication-constraint row, no cited source, no stated derivation, and no skill-default label on its own line at the point of use (an invented number)."
  - "An IPC current-carrying chart, formula, or coefficient presented as the basis for a trace width."
  - "A per-pin 10 uF / 1 uF / 0.1 uF decoupling stack recommended, or a capacitor value or count chosen by anything other than the datasheet, or power distributed by a board-wide copper fill with no datasheet or current requirement stated as the reason."
  - "The rule set is presented as done without an after-build realization check when a runtime is available; an unavailable runtime must be declared as an open item, never silently skipped."
  - "A route-width check passes with zero realized traces, skips a realized Polygon because it has no width field, or accepts an escape width equal to or wider than any pad selected by the rule."
  - "A rule is declared and no check observes it, and the output is still presented as complete. A rule nothing witnesses is indistinguishable from a rule that did not apply."
  - "A source the skill points at is unreachable and the output proceeds as though it had been read, presenting recalled or reconstructed content as fetched. Reporting the unreachable source and stopping is a pass; reporting it and continuing under a stated assumption is a pass; silence is not."
