# Eval contract for jitx-interactive-layout.
#
# Scope: placing and routing in the open layout of a live design through
# jitx design session and jitx design exec, with the rd.layout request API,
# so the result stays editable in the board editor; reading the result back
# through route status, the report script and rd.issues(); applying a tag the
# design declares to a layout object, and reading tags, applied rules and a
# route's possible ends from the live design where the installed jitx can
# answer. Writing rules, constraints, Tag classes or code geometry is out of
# scope (sibling skills).
goal: |
  An engineer whose design already carries its layout constraints asks an
  agent to place and route part or all of the board, and gets a layout made
  of interactive objects (placements, routes, vias, control points, pours)
  that they can keep editing in the board editor. Excellent = the agent grounds
  its plan in the design's constraints before planning (asked of the live
  design where the installed jitx answers, read from the source otherwise),
  chooses the pins of a require pool for the whole pool before routing any of
  it, drives the layout from re-runnable scripts, reads the state back after
  every batch, does not call anything done on an accepted request or an empty
  issue list, states each interactive-API limitation it hit (a jitx without
  the route-end, constraint and tag calls; one copy of a thing loaded at a
  time) and works around it rather than hiding it, and reports what it
  verified and what it did not. A weaker agent model following the skill
  should still get there, because the skill carries the mechanics and the
  checks.
dimensions:
  - "INTERACTIVE_NOT_CODE: are placements, routes, vias, control points, pours and tags on layout objects made through rd.layout requests in scripts run by jitx design exec, with no code Route, code-placed via, Copper or tag assignment added to the design source to stand in for them?"
  - "CONSTRAINT_GROUNDING: is every rule the plan depends on grounded: widths, clearances and routing structures asked of the live design with rd.layout.constraints where the installed jitx has it, or read from the design source and named with the file; topologies and timing bounds read from the source; and is any width or space override on a request justified by one of those rules, or by the measured width of the pad it ends on?"
  - "READ_BACK: after each batch, does the agent read route status, issues (with every category complete) and its own connectivity check for plain nets, read a tag and the rule that applies back after tagging, treat blocked routes and split pours as signals to change placement or order, and keep the floorplan and checks as re-runnable files?"
  - "PLACE_AND_ROUTE_CRAFT: are local circuits dense with courtyards clear, escapes planned, the pins of a require pool chosen for the whole pool before any of its signals is routed and checked against the least-total selection, decoupling capacitors turned so the pads that close each loop face the pins they serve, with each loop's area measured against a stated mm^2 target, power and ground taken to planes through short via routes with same-net vias shared where they can be, vias placed only at computed free spots, hull pours used for switch nodes with distinct ranks and expand for thermals, and tight connections routed before pours and bulk?"
  - "SI_DISCIPLINE: on SI-constrained work, do fanouts go in first, is pin assignment chosen by the agent from the pool (its possible ends asked of the live design, or the provide/require pool read from the source) rather than read from the capture's nets, are skew margins read from rd.issues(satisfied=True) or layout_report.py issues_all, and are length-matching regions added only after skew is close, with space planned and P/N skew addressed before macro skew?"
  - "LIMITATION_HONESTY: are the interactive API's limitations stated where they bite (on a jitx without the tag, constraint and route-end calls: routes needing a tag listed for the user to tag, constraints read from source, the pool derived from source; on any jitx: assignments requested explicitly), with nothing presented as verified that was not read back?"
hard_fails:
  - "A code Route, code-placed via, Copper, or layout tag written into the design source as the way to deliver the requested interactive layout."
  - "The layout is called done on the strength of accepted requests, a clean build, or an empty issue list, with no route-status read-back and no connectivity check for plain nets."
  - "A claim that the agent queried constraints, applied a tag, or listed a route's possible ends when no script of the run made that call and read its result."
  - "A via placed with force=True at a spot the agent did not check for clearance from other pads, courtyards and neighbouring escapes. A via at the centre of its own pad, on a definition that allows via-in-pad, is a valid spot and needs no clearance check from that pad."
  - "Pin assignment for a constrained interface taken from the nets the session capture assigned, with no eligible pool asked of the live design or read from the design source."
  - "Length-matching regions added to an SI group before its routes are measured, or with no measured margins reported."
  - "An invented electrical number (inductance, skew, delay, current) with no source, measurement, or labeled estimate."
