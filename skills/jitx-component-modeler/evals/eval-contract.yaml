# Eval contract for jitx-component-modeler.
# The dimensions mirror the SKILL.md "Component completeness check" categories,
# except SYMBOL_STRUCTURE, which comes from the routing table's multi-unit row
# and references/component-code-patterns.md.
# The skill's own definition of what a good component has is the rubric its
# outputs are judged against. That block cites, rather than restates, the base
# skill's jitx/references/domains/component-modeling.md checklist, so the
# checklist keeps a single owner and the block stays the completion gate.
goal: |
  An engineer hands the skill a datasheet PDF, a vendor's machine-readable pin file, or a
  vendor CAD footprint for one named part, and gets back JITX component code in which every
  dimension, pin label and pad assignment traces to a cited page, figure or file entry of
  that source: the right land-pattern generator, or an entry-by-entry import of the vendor
  footprint where no generator expresses the package, one Port per physical pin, for a
  multi-unit part a symbol partitioned along the part's own functional groups, and
  library-table defaults checked against the source rather than assumed.
  Excellent = a reviewer can put the generated file next to its source and reconcile it
  figure by figure or entry by entry, with nothing left over and nothing invented, and a weaker agent model
  (customers run Sonnet-class agents and tools like Devin) still gets there by following the
  skill, because the skill carries the checks rather than assuming a strong model.
dimensions:
  - "SOURCE_AUTHORITY: does every dimension, pin label and pad assignment cite the source page, figure or file entry it came from, with nothing written from memory, 'typical', 'approximate' or 'refine later', and no library-table default accepted where the source publishes the number?"
  - "PIN_COMPLETENESS: one Port per physical pin, pad or ball including NC pins that have pads and the thermal pad; source-primary names; incrementing names as indexed arrays rather than sibling attributes; no duplicates; an explicit PadMapping wherever declaration order is not pad order or a pad is shared?"
  - "LANDPATTERN_FIDELITY: for a generated land pattern: correct generator for the package family; dimensions from the mechanical drawing as Toleranced min/typ/max rather than bare nominals; thermal pad written as rectangle(E2, D2) with paste subdivision where the area warrants it; lead extents taken from the band the drawing dimensions on the seating plane; documented constructor signatures only, no invented parameters? For a land pattern imported from a vendor CAD footprint: every pad, hole, soldermask and paste entry matches the file after converting the file's coordinate frame (a land the file lists under two pad numbers may be one pad), non-plated holes are cutouts with no copper, plated holes carry copper, and each pad and hole has the soldermask and paste the file gives it, any omission recorded with a reason?"
  - "SYMBOL_STRUCTURE: for a multi-unit part, is the symbol partitioned along the functional groups the source itself defines (one unit per I/O bank, per amplifier, per peripheral block); do shared supplies and grounds sit on their own unit or units, while a supply that belongs to one group (an FPGA bank's VCCO) sits with that group and nowhere else; is every port on exactly one unit, none twice and none missing, no-connect ports included; and does a standard-function unit use the matching jitxlib symbol class where one exists? Scored n/a for a single-unit part."
  - "VERIFICATION_INTEGRITY: does the code parse, type-check and build; do tests subclass jitx.test.TestCase rather than plain unittest.TestCase; is a direct construction wrapped in a substrate context where the generator needs one; and is every library-table default the code relies on asserted against the source?"
  - "GENERATION_INTEGRITY: for a component generated from a machine-readable pin map: is the parse reconciled against the source's own totals BEFORE any component code exists; does the inventory partition the pins rather than merely sum to the right total; is the emitter deterministic and formatter-stable with a regenerate-and-diff mode that passes; is the source recorded by raw-byte hash and origin; and are ball-reference strings confined to comments while coordinates carry the structure? Scored n/a for the datasheet and CAD-footprint lanes."
  - "BOM_METADATA_FIDELITY: mpn, manufacturer, datasheet (where the part has a public one) and reference_designator_prefix all set and correct; value left unset and pinned unset by a test, since a filled value label is a defect; and no constructor parameter or computed part number invented beyond what the source offers?"
hard_fails:
  - "A dimension, pin label or pad assignment on a part with a real MPN that traces to no cited source page, figure or file entry and carries no user-recorded authorization for a generic placeholder. The rule is about values that could be wrong, not labels the source never supplied."
  - "A library-table default (a generator default, a standard lead profile) relied on without being checked against the source's own dimensions, where the source publishes them."
  - "The generated code fails Python syntax or type checking, when the environment can run those checks."
  - "The component is presented as complete without the SKILL.md Component completeness check block."
  - "The component fails jitx build when a build environment is available; an unavailable environment must be declared as an open item in the completion block, never silently skipped."
  - "A pin map transcribed, sampled-and-extrapolated, or otherwise produced by any route other than parsing the machine-readable source, where such a source was supplied."
  - "Component code emitted before the parse was reconciled against the source's own totals, or an inventory whose groups overlap presented as if it accounted for every pin."
  - "A pin name silently renamed or dropped because it was not a valid identifier, or two distinct source names collapsed onto one attribute without the collision being raised."
  - "An imported land pattern whose pad positions are the mirror image of the source's layout once the source is converted to JITX's frame, as seen from the top side."
