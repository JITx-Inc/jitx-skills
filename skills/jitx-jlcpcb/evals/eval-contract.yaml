# Eval contract for jitx-jlcpcb.
# The dimensions follow the SKILL.md sections in order (opt in, substrate, parts,
# landpatterns, export) plus API fidelity, since every name the skill uses comes
# from the jitxlib-jlcpcb package and a weaker runner will otherwise invent them.
goal: |
  A user who has chosen JLCPCB gets a JITX design that builds against one of
  JLCPCB's predefined substrates with its passives and parts resolved to catalogue
  C-numbers, and a packet directory JLCPCB's intake accepts (gerber archive, BOM,
  pick-and-place file, order sheet), with the user asked to approve the resolved
  MPNs and C-numbers before anything is ordered. The skill does this without making
  JLCPCB a default for anyone else: it installs the package and names its chain only
  after the user chose JLCPCB, and says what installing changes.
  Excellent = a reviewer can upload the packet as written, every BOM row carries a
  C-number or is named to the user, every catalogue footprint carries a recorded
  approval and a pad-by-pad check, and a weaker agent model (customers run
  Sonnet-class agents) gets there by following the skill.
dimensions:
  - "OPT_IN_DISCIPLINE: is jitxlib-jlcpcb installed and added to dependencies only after the user chose JLCPCB; does the agent tell the user that installing the package publishes a parts chain that changes resolution for a project naming none; is the chain named explicitly, with any approved list first, the catalogue behind it and no `ideal`; and does an existing chain keep its order?"
  - "SUBSTRATE_FIT: is the substrate a jitxlib.jlcpcb class whose layer count and routing structures cover every impedance the design's interfaces need (for example a 90 ohm pair only on a 4-layer class), chosen with the trace widths in mind, or, where no class fits, a custom substrate routed to jitx-substrate-modeler with the reason stated?"
  - "PARTS_RESOLUTION: are basic parts preferred by `rank=Minimize(\"library\")` rather than a filter that finds nothing; does every assembled component that no query resolves carry an LCSCPart field on the component itself; is channel evidence (stock, lifecycle, datasheet URL, pinout) saved per named C-number and cited; and is the user asked to approve the final MPNs and C-numbers before ordering?"
  - "CATALOGUE_DATA_CONSENT: is any LCSCLandpattern, including one a queried non-chip passive brings in, used only with the user's explicit approval recorded under the component's Notes, with an explicit ports= map from the manufacturer's pinout, a pad-by-pad check against the manufacturer's drawing, and for a polarized part an anode/cathode check?"
  - "PACKET_COMPLETENESS: does the packet directory hold the gerber zip, BOM CSV, CPL CSV and order sheet; does every BOM row carry a C-number or appear in the agent's report to the user; do the order sheet's layer count and thickness match the substrate; is lcsc.lock.json present and left for commit; and are the order sheet's attention lists and the placement-preview check passed to the user?"
  - "API_FIDELITY: does every jitxlib.jlcpcb name, argument and CLI flag used exist in the installed package (JLC04161H_1080, JLC04161H_7628, JLC06161H_7628, LCSCPart, LCSCLandpattern, the `jlcpcb` and `lcsc` chain entries, `jitx design export jlcpcb --output`, `--no-assembly`, `--names jlcpcb`), with nothing invented?"
hard_fails:
  - "The design fails jitx build, or the export fails, when a build environment with network access to the catalogue is available; an unavailable environment must be declared as an open item in COMPLETION.md, never silently skipped."
  - "An LCSCLandpattern used without a user approval recorded for this project under the component's Notes."
  - "A packet presented to the user as orderable while the chain contains `ideal` or the design or BOM carries an `IDEAL-` part."
  - "An API name, argument or CLI flag attributed to jitxlib-jlcpcb or the jitx CLI that does not exist in the installed package."
  - "The agent uploads the packet or places an order, or tells the user it has."
