goal: |
  On jitx 4.6, an engineer can describe a signal path, a timing relationship,
  or an SI limit and receive constraint code that names each path's two ends
  with Topology(begin, end) over ordinary nets, closes the path with routes,
  carries a pin model on every part and via the signal passes through, uses
  the primitive and routing structure that match the signal type, takes every
  numeric limit and model value from a named source, and proves each
  constraint applied by its measurement in the design issues report, read with
  satisfied checks included.
dimensions:
  - "PATH_CLOSURE: does each constrained path name its ends with Topology(begin, end) on ports joined by ordinary nets, have routes (code Route objects, or a stated routing step) along every segment so the path can be inferred, carry a BridgingPinModel on every part with a path through it (a flow-through package whose opposite pin is n.c. gets none, and its two lands are one net) and a models entry on every via for the layers it spans, add TerminatingPinModel where package or connector data is supplied, and reserve >> for a daisy chain whose order the router must follow?"
  - "ENDPOINT_AND_SPAN_FIDELITY: are both Topology endpoints actual elements of the intended chain, and does the constraint cover the intended end-to-end span rather than a reachable but shorter segment?"
  - "CONSTRAINT_PRIMITIVE_FIT: does single-ended work use Constrain and RoutingStructure, differential work use ConstrainDiffPair or DiffPairConstraint with DifferentialRoutingStructure, skew across a bundle use ConstrainReferenceDifference with a single-pin guide (one leg of a pair), and reusable SignalConstraint subclasses initialize their base state?"
  - "TIMING_AND_SI_PROVENANCE: do timing, skew, insertion-loss, impedance, reference-plane, and pin-model delay and loss values trace to the requested protocol revision, component or via data, the substrate definition, values the user supplied, or an explicit open item?"
  - "MEASURED_BINDING_EVIDENCE: does verification run jitx design issues <Design> --satisfied (or RuntimeDesign.issues(satisfied=True)), show a Time, Loss, or Skew measurement for every constraint it claims, treat Unconnected Topology, not routed yet, No path ... no pin model, Missing routing structure, a placeholder structure model, and Unassigned Pin as unresolved, and keep binding (a measurement exists) apart from compliance (the measurement is inside its target)?"
  - "PIN_ASSIGNMENT_RESOLUTION: when a constrained end is a require()d port, is the assignment resolved (code routes on the provider's physical pins, matching an offered mapping) before a measurement is claimed, with no route ending on a require()d port and no require()d port stored on self?"
hard_fails:
  - "The answer declares >> (TopologyNet) on a path that is not a daisy chain whose order the router must follow, or tells the user >> is required for timing, loss, or skew constraints to apply."
  - "A part or via on a constrained path has no pin model (no BridgingPinModel on a part with a path through it, no models entry on a via for the layers it spans) and the answer neither adds one nor reports the resulting No path or placeholder-model issue as unresolved."
  - "The result claims a constraint applies without a measured Time, Loss, or Skew line from the design issues report read with satisfied checks included; status: ok, a clean build, type checking, an empty issue list without --satisfied, or the existence of a harness does not count."
  - "A constraint on a require()d port is claimed to measure without the pin assignment resolved, or a route is made to end on a require()d port."
  - "A reachable endpoint stops short of the intended chain end and the uncovered span is neither rejected nor explicitly justified as intentional."
  - "DifferentialRoutingStructure is passed through Constrain.structure instead of ConstrainDiffPair or DiffPairConstraint."
  - "A timing, skew, insertion-loss, impedance, reference-plane, or pin-model number is invented, or is presented as verified without the evidence surface needed to support it."
